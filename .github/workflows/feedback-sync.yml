name: Sync feedback summary

on:
  schedule:
    - cron: "15 4 * * *"
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feedback-summary
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check local run window
        id: local_time
        run: |
          if [ "$(TZ=Europe/Berlin date +%H)" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.local_time.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Fetch anonymized feedback summary
        if: steps.local_time.outputs.run == 'true'
        env:
          SUPABASE_URL: https://zwzgbfyjqmmxzsonpdfj.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_x2Nv1tiZg2k8A0nwNC7qhA_K2QwWpAM
        run: |
          FROM_DATE="$(date -u -d '180 days ago' +%F)"
          TO_DATE="$(date -u +%F)"
          curl --fail --silent --show-error \
            --request POST \
            --url "$SUPABASE_URL/rest/v1/rpc/feedback_summary" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"p_from\":\"$FROM_DATE\",\"p_to\":\"$TO_DATE\"}" \
            | jq 'sort_by(.edition_date, .article_id)' \
            > feedback-summary.new.json
          test -s feedback-summary.new.json
          mv feedback-summary.new.json feedback-summary.json

      - name: Commit changes
        if: steps.local_time.outputs.run == 'true'
        run: |
          if git diff --quiet -- feedback-summary.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedback-summary.json
          git commit -m "Update feedback summary"
          git push
